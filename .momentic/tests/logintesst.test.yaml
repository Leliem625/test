name: logintesst
baseUrl: https://printerval.com
description: test login
schemaVersion: 1.0.24
advanced:
  viewport:
    width: 1280
    height: 800
  browserType: Chromium
parameters:
  - name: USERNAME
    default:
      string: test@example.com
  - name: PASSWORD
    default:
      string: password123
steps:
