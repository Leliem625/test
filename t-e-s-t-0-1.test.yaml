    text: Open https://printerval.com, search for "cat tshirt", open the first
      product, add it to cart, proceed to checkout, if any popup (especially
      newsletter/marketing popup) appears close it if it blocks interaction, add
      "?mode=test" to the checkout URL and ensure checkout page is still
      visible, enter email "${email}", fill all remaining required fields
      manually and add order note "Ky thuat test", select Visa payment method,
      enter card details (card number "${Card number}", expiry "${Expiry date}",
      CVV "${CVV}"), complete the payment, verify that an order success page is
      displayed with no errors or broken UI, retry once if any click action
      fails, and after completion or failure send a summary report email to
      "${email}".
